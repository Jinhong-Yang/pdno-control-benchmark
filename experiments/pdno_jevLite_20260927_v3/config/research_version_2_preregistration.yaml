protocol_corrections_required_before_final_freeze:
  training_losses:
    - Implement and log source-defined L_field, L_obs with observation-operator consistency, L_PDE at random x/tau and random train actions, L_balance including forcing and boundary flux, L_rank, and diagnostic L_BC.
    - Keep a common observation/initialization path across P and B5; B5 disables only predeclared physics/balance terms.
    - Use train-only scales; collocation/autograd physics remains FP32 with autocast off.
  causal_input_parity:
    - Feed declared causal applied-action history to learned policies or revise the entire input contract before new data; do not include unavailable/future actions.
    - Audit comparator observer information, sensor/image mask/age, no-observation behavior, and all applied-action projection stages.
  model_and_baseline_selection:
    - Checkpoint order: numerical validity, validation state-violation gate, validation closed-loop cost, then predeclared latency tie band.
    - Select H3 comparator over eligible non-generative required methods on validation only, not only B0/B1 by convenience; freeze it before v2 lock.
  evaluation_and_statistics:
    - Rebuild aggregator from source-defined estimands with independent parent as unit, per-parent comparator/floor normalization, paired parent bootstrap, explicit seed hierarchy, and per-seed and pooled violation endpoints.
    - Predeclare missingness, fallback, timeout, and failure handling; no partial locked metrics.
  systems:
    - Preserve B4 shared encoder and candidate-axis batching.
    - Preserve B3 as direct policy optimized through a frozen B4 action-cost surrogate; inference remains direct-policy only.
    - Measure CPU and CUDA closed-loop pilot and episode-batched evaluator equivalence. Any speed optimization must be applied fairly to all affected methods and be frozen pre-test.
